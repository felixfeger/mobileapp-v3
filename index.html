<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Plan trips across City Metro rail and bus service.">
  <title>City Metro Trip-Planner</title>
  <link rel="icon" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>

  <!-- announcements for screen readers, and the visible toast -->

  <noscript>
    <p style="padding:24px;font-family:Helvetica,Arial,sans-serif">The City Metro Trip-Planner needs JavaScript to plan trips. Please turn it on and reload this page.</p>

  <script type="module" src="js/app.js"></script>

</html>
