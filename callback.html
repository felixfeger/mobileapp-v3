<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>Signing in… · City Metro Trip-Planner</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="cb-page">
  <!-- Where the City Metro sign-in service sends you back to. Register this page's URL as a redirect URI. -->
  <main class="cb" id="main">
    <img class="cb-logo" src="img/logo.png" alt="City Metro" width="64" height="64">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Finishing sign-in…</h1>
    <p class="muted" role="status">One moment while we complete your sign-in.</p>
    <noscript><p>Signing in needs JavaScript. Please turn it on and try again.</p></noscript>
  </main>
  <script type="module" src="js/auth/callback.js"></script>
</body>
</html>
